<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonBit Dialogs</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fb;
      color: #1c212b;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(520px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 16px 42px rgba(24, 30, 42, 0.12);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.2;
    }
    p {
      margin: 0 0 22px;
      color: #526071;
      line-height: 1.5;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    button {
      min-height: 44px;
      border: 1px solid #c9d2df;
      border-radius: 6px;
      background: #f8fafc;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      border-color: #1769d1;
      background: #1769d1;
      color: #ffffff;
    }
    output {
      display: block;
      min-height: 22px;
      padding: 12px 14px;
      border: 1px solid #d8dee8;
      border-radius: 6px;
      background: #f8fafc;
      font-variant-numeric: tabular-nums;
    }
    @media (max-width: 520px) {
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Native Message Dialogs</h1>
    <p>Each button sends a typed IPC command to the native host. The host opens a native dialog and returns the selected button.</p>
    <div class="actions">
      <button id="info" class="primary" type="button">Info</button>
      <button id="warning" type="button">Warning</button>
      <button id="question" type="button">Question</button>
    </div>
    <output id="status" aria-live="polite">No dialog opened yet.</output>
  </main>
  <script>__MOONBIT_DIALOG_FRONTEND__</script>
</body>
</html>
