<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonBit File Dialogs</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f4f6f8;
      color: #1c232b;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(600px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid #d5dce5;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 16px 42px rgba(22, 29, 38, 0.12);
    }
    h1 {
      margin: 0 0 10px;
      font-size: 24px;
      line-height: 1.2;
    }
    p {
      margin: 0 0 22px;
      color: #526071;
      line-height: 1.5;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 18px;
    }
    button {
      min-height: 44px;
      border: 1px solid #c6d1dc;
      border-radius: 6px;
      background: #f8fafb;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      border-color: #0f766e;
      background: #0f766e;
      color: #ffffff;
    }
    output {
      display: block;
      min-height: 72px;
      padding: 12px 14px;
      border: 1px solid #d5dce5;
      border-radius: 6px;
      background: #f8fafb;
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 13px;
      line-height: 1.45;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    @media (max-width: 520px) {
      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <main>
    <h1>Native File Dialogs</h1>
    <p>Each button sends a typed IPC command to the native host. Save File writes a small text file after the native dialog returns a path.</p>
    <div class="actions">
      <button id="open-file" class="primary" type="button">Open File</button>
      <button id="open-files" type="button">Open Files</button>
      <button id="save-file" type="button">Save File</button>
      <button id="open-folder" type="button">Open Folder</button>
    </div>
    <output id="status" aria-live="polite">No file dialog opened yet.</output>
  </main>
  <script>__MOONBIT_FILE_DIALOG_FRONTEND__</script>
</body>
</html>
