<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MoonBit Counter</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f6f7f9;
      color: #1b1d22;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }
    main {
      width: min(420px, calc(100vw - 32px));
      padding: 28px;
      border: 1px solid #d8dce2;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 36px rgba(21, 25, 34, 0.10);
    }
    h1 {
      margin: 0 0 20px;
      font-size: 24px;
      line-height: 1.2;
    }
    output {
      display: block;
      margin: 0 0 20px;
      font-size: 72px;
      line-height: 1;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }
    .actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
    }
    button {
      min-height: 42px;
      border: 1px solid #cbd1da;
      border-radius: 6px;
      background: #f7f9fc;
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    button.primary {
      border-color: #0f6fdc;
      background: #0f6fdc;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <main>
    <h1>MoonBit Counter</h1>
    <output id="count" aria-live="polite">0</output>
    <div class="actions">
      <button id="dec" type="button">-1</button>
      <button id="reset" type="button">Reset</button>
      <button id="inc" class="primary" type="button">+1</button>
    </div>
  </main>
  <script>__MOONBIT_COUNTER_FRONTEND__</script>
</body>
</html>
